[project]
name = "anthill"
version = "0.18.0"
description = "AntHill — 基于文件邮箱的分布式多 Agent 协同框架"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "asyncssh>=2.14",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-ulid>=3.0",
    "spake2>=0.9",
    "rich>=13.7",
    "typer>=0.12",
    "uvicorn>=0.30",
    "websockets>=12",  # uvicorn 没有 ws 实现时，WS 升级请求会被当成 404
    "watchdog>=4.0",
]

[project.scripts]
anthill = "anthill.cli.main:app"

[project.optional-dependencies]
llm = [
    "anthropic>=0.34",
    "openai>=1.40",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    # 面板得在真浏览器里点一遍 —— 相对路径怎么解析、WS 通不通，
    # curl 和 ASGI 传输都测不到（这两处都真出过 bug）。
    # 浏览器本体要另装：uv run playwright install chromium；没装就自动跳过。
    "playwright>=1.45",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anthill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001-003：中文注释里的全角标点会被判为「歧义字符」，本项目文档就是中文，忽略
# B008：typer 的参数默认值就是 typer.Option(...) 调用，是框架惯例
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["watchdog.*", "spake2.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["anthill"]
