name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups --python ${{ matrix.python-version }}

      - name: Lint
        run: |
          uv run ruff check anthill tests
          uv run ruff format --check anthill tests

      - name: Type check
        run: uv run mypy anthill

      - name: Test
        run: uv run pytest -q --cov=anthill --cov-report=term --cov-fail-under=80
