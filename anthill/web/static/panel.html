<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AntHill 面板</title>
<style>
/* 视觉方向：贴着终端用的技术仪表盘。等宽字体为主，状态一律用语义色，
   信息密度优先 —— 这是排查问题时开着的第二个窗口，不是营销页。 */
:root {
  color-scheme: dark light;
  --bg: #0e0f13;
  --surface: #16181f;
  --surface-2: #1c1f28;
  --line: #262a36;
  --text: #e6e8ef;
  --muted: #8b91a3;
  --dim: #5d6376;
  --accent: #f0a02c;      /* 蚁丘的琥珀色 */
  --ok: #4ec9a0;
  --warn: #e3b341;
  --bad: #f2726f;
  --idle: #6b7286;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --gap: 14px;
  --radius: 10px;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f0f2f6; --line: #dfe3ea;
    --text: #14161c; --muted: #5a6172; --dim: #868da0; --accent: #b96f06;
    --ok: #16855f; --warn: #9a7212; --bad: #c33c39; --idle: #7b8296;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--mono); font-size: 13px; line-height: 1.55;
}
a { color: var(--accent); }

/* ---- 顶栏：节点身份是最大的一块字，其余都压小 ---- */
header {
  display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  padding: 18px 22px 14px; border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
  position: sticky; top: 0; z-index: 5;
}
header h1 {
  margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em;
}
header h1 .mark { color: var(--accent); }
header .node { font-size: 13px; color: var(--muted); }
header .node b { color: var(--text); font-weight: 600; }
#conn { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; gap: 7px; align-items: center; }
#conn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--idle); }
#conn.live .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
#conn.down .dot { background: var(--bad); }

/* ---- bento：左栏拓扑，右侧上任务下消息流 ---- */
main {
  display: grid; gap: var(--gap); padding: var(--gap) 22px 26px;
  grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
  grid-template-areas: "topo runs" "topo stream" "setup setup" "config config";
  grid-template-rows: auto minmax(0, 1fr) auto auto;
  min-height: calc(100vh - 66px);
}
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; grid-template-areas: "topo" "runs" "stream" "setup" "config"; }
}
section {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  display: flex; flex-direction: column; min-height: 0; overflow: hidden;
}
#topo { grid-area: topo; } #runs { grid-area: runs; } #stream { grid-area: stream; }
section > h2 {
  margin: 0; padding: 11px 14px; font-size: 11px; font-weight: 600;
  letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted);
  border-bottom: 1px solid var(--line); background: var(--surface-2);
  display: flex; justify-content: space-between; align-items: center;
}
section > h2 .count { color: var(--dim); letter-spacing: 0; text-transform: none; }
.body { overflow: auto; padding: 8px; flex: 1; min-height: 0; }
.empty { color: var(--dim); padding: 18px 8px; text-align: center; }

/* ---- 卡片：hover 有明确反馈，不是死的表格 ---- */
.card {
  border: 1px solid transparent; border-radius: 7px; padding: 8px 10px;
  transition: background 140ms ease, border-color 140ms ease;
}
.card:hover { background: var(--surface-2); border-color: var(--line); }
.row { display: flex; align-items: baseline; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.name { font-weight: 600; }
.meta { color: var(--dim); font-size: 12px; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---- 状态点：颜色是唯一的状态语言，别处不再用装饰色 ---- */
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--idle); }
.dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
.pill {
  font-size: 11px; padding: 1px 7px; border-radius: 99px;
  border: 1px solid var(--line); color: var(--muted); background: var(--surface-2);
}
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }

/* ---- 任务：步骤用左侧色条串起来，一眼看出卡在哪一步 ---- */
.run { padding: 10px 12px; border-radius: 8px; background: var(--surface-2); margin-bottom: 8px; }
.run > .row { margin-bottom: 6px; }
.goal { font-weight: 600; }
.steps { display: flex; flex-direction: column; gap: 3px; }
.step { display: flex; gap: 9px; align-items: baseline; padding-left: 9px; border-left: 2px solid var(--line); }
.step.running { border-left-color: var(--warn); }
.step.done { border-left-color: var(--ok); }
.step.failed { border-left-color: var(--bad); }
.step.skipped { border-left-color: var(--dim); }
.step .sid { color: var(--muted); min-width: 34px; }
.step .who { color: var(--accent); min-width: 96px; }
.step .what { color: var(--muted); }

/* ---- 消息流：等宽对齐的时间线 ---- */
.event { display: flex; gap: 10px; padding: 2px 6px; border-radius: 5px; }
.event:hover { background: var(--surface-2); }
.event .ts { color: var(--dim); flex: none; }
.event .who { color: var(--accent); flex: none; min-width: 92px; }
.event .what { flex: none; min-width: 168px; }
.event .detail { color: var(--muted); }
.event.warn .what { color: var(--warn); }
.event.error .what { color: var(--bad); }
/* ---- 节点分组：总控视图下，每台机器一组 ---- */
.node-group { margin-bottom: 10px; }
.node-head {
  display: flex; align-items: baseline; gap: 8px; padding: 6px 10px 4px;
  border-bottom: 1px dashed var(--line); margin-bottom: 4px;
}
.node-head .name { font-weight: 600; letter-spacing: 0.02em; }
.node-head .tag { font-size: 11px; color: var(--dim); }
.node-group.down { opacity: 0.72; }
.node-group.down .node-head { border-bottom-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.where { color: var(--dim); flex: none; min-width: 84px; }

/* ---- 操作条：写权限开着才出现 ---- */
.actions { display: flex; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.actions input, .actions select, textarea {
  background: var(--bg); color: var(--text); border: 1px solid var(--line);
  border-radius: 7px; padding: 7px 10px; font-family: var(--mono); font-size: 13px;
  transition: border-color 140ms ease, box-shadow 140ms ease;
}
.actions input { flex: 1; min-width: 0; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
}
button {
  background: var(--accent); color: #1a1206; border: 1px solid transparent;
  border-radius: 7px; padding: 7px 14px; font-family: var(--mono); font-size: 13px;
  font-weight: 600; cursor: pointer; transition: filter 140ms ease, transform 80ms ease;
}
button:hover { filter: brightness(1.08); }
button:active { transform: translateY(1px); }
button.ghost { background: transparent; color: var(--muted); border-color: var(--line); }
button.ghost:hover { color: var(--text); border-color: var(--muted); }
button[disabled] { opacity: 0.5; cursor: not-allowed; }
.hint { padding: 0 12px 10px; font-size: 12px; color: var(--dim); }
.hint.bad { color: var(--bad); }
.hint.ok { color: var(--ok); }

/* ---- 标签页与对话 ---- */
.tabs { display: flex; gap: 4px; }
.tab {
  background: transparent; color: var(--dim); border: 1px solid transparent;
  border-radius: 6px; padding: 3px 10px; font-size: 11px; letter-spacing: 0.13em;
  text-transform: uppercase; font-weight: 600;
}
.tab:hover { color: var(--text); }
.tab.on { color: var(--text); background: var(--surface); border-color: var(--line); }
.msg { padding: 7px 10px; border-radius: 9px; margin: 6px 0; max-width: 78%; font-size: 13px; }
.msg .who { display: block; font-size: 10px; color: var(--dim); margin-bottom: 3px; }
.msg .text { white-space: pre-wrap; word-break: break-word; }
.msg.them { background: var(--surface-2); border: 1px solid var(--line); }
.msg.mine {
  margin-left: auto; background: color-mix(in srgb, var(--accent) 16%, var(--surface-2));
  border: 1px solid color-mix(in srgb, var(--accent) 34%, transparent);
}
.msg.sys { max-width: 100%; background: transparent; color: var(--dim); font-size: 11px; }
#chat-body { display: flex; flex-direction: column; }
.pair-pin {
  font-size: 26px; letter-spacing: 0.28em; color: var(--accent);
  padding: 6px 0 2px; font-weight: 700;
}
.node-head button { padding: 2px 8px; font-size: 11px; }
.card .ops { display: flex; gap: 4px; opacity: 0; transition: opacity 120ms ease; }
.card:hover .ops, .card:focus-within .ops { opacity: 1; }
.card .ops button { padding: 1px 7px; font-size: 11px; }
.add-agent { display: grid; gap: 6px; padding: 8px 10px; border-top: 1px dashed var(--line); }
.add-agent .line { display: flex; gap: 6px; }
.add-agent input, .add-agent select { flex: 1; min-width: 0; }

/* ---- 设置：还没配工作区，或者要管这台机器上的多个工作区 ---- */
#setup { grid-area: setup; }
#setup .body { display: grid; gap: 10px; }
.ws { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px; }
.ws:hover { background: var(--surface-2); }
.ws .path { color: var(--dim); font-size: 12px; }
.ws.now { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.crumbs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 0 10px; }
.crumbs code { color: var(--muted); }
.dirs { max-height: 210px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.dir { display: flex; gap: 8px; align-items: center; padding: 5px 10px; cursor: pointer; }
.dir:hover { background: var(--surface-2); }
.dir .tag { font-size: 11px; color: var(--ok); }

/* ---- 配置抽屉 ---- */
#config { grid-area: config; }
#config .drawer-head select { max-width: 180px; }
#config textarea { width: 100%; min-height: 220px; resize: vertical; line-height: 1.5; }
.drawer-head { display: flex; align-items: center; gap: 10px; }
footer { padding: 0 22px 20px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1><span class="mark">▲</span> AntHill</h1>
  <span class="node">节点 <b id="node">…</b></span>
  <span id="conn"><span class="dot"></span><span id="conn-text">连接中</span></span>
</header>

<main>
  <section id="topo">
    <h2>拓扑 <span class="count" id="topo-count"></span></h2>
    <div class="body" id="topo-body"></div>
  </section>

  <section id="runs">
    <h2>任务看板 <span class="count" id="runs-count"></span></h2>
    <form class="actions" id="run-form" hidden>
      <input id="run-input" placeholder="交给 coordinator 一件事，回车发起…" autocomplete="off" />
      <button type="submit">发起</button>
    </form>
    <div class="hint" id="run-hint" hidden></div>
    <div class="body" id="runs-body"></div>
  </section>

  <section id="stream">
    <h2>
      <span class="tabs">
        <button class="tab on" type="button" data-pane="events">消息流</button>
        <button class="tab" type="button" data-pane="chat">对话</button>
      </span>
      <span class="count" id="events-count"></span>
    </h2>
    <div class="body" id="stream-body"></div>
    <div class="body" id="chat-body" hidden></div>
    <form class="actions" id="chat-form" hidden>
      <select id="chat-to" aria-label="跟谁说"></select>
      <input id="chat-input" placeholder="说点什么，回车发送…" autocomplete="off" />
      <button type="submit">发送</button>
    </form>
    <div class="hint" id="chat-hint" hidden></div>
  </section>
</main>

  <section id="setup" hidden>
    <h2>
      <span class="drawer-head">工作区 <span class="count" id="setup-count"></span></span>
      <span class="drawer-head">
        <button class="ghost" id="setup-toggle" type="button">选一个目录…</button>
      </span>
    </h2>
    <div class="body">
      <div id="ws-list"></div>
      <div id="picker" hidden>
        <div class="crumbs"><span class="meta">当前位置</span><code id="crumb-path"></code>
          <button class="ghost" id="crumb-up" type="button">上一级</button></div>
        <div class="dirs" id="dir-list"></div>
        <form class="actions" id="ws-form">
          <input id="ws-name" placeholder="新建子目录名（留空 = 就用当前这个目录）" autocomplete="off" />
          <input id="ws-node" placeholder="节点名，留空取主机名" autocomplete="off" />
          <button type="submit">在这里建工作区</button>
        </form>
      </div>
      <div class="hint" id="setup-hint" hidden></div>
    </div>
  </section>

  <section id="config" hidden>
    <h2>
      <span class="drawer-head">
        node.toml
        <select id="config-node" aria-label="改哪台机器"></select>
        <span class="count">改坏了所有 agentd 都起不来，保存前会先校验</span>
      </span>
      <span class="drawer-head">
        <button class="ghost" id="config-reload" type="button">重新读取</button>
        <button id="config-save" type="button">保存</button>
      </span>
    </h2>
    <div class="body">
      <textarea id="config-text" spellcheck="false"></textarea>
      <div class="hint" id="config-hint"></div>
    </div>
  </section>
<footer id="footer">只读面板 —— 确认与操作留在 CLI。数据来自 <code>.anthill/</code> 下的文件。</footer>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function setConn(state, text) {
  const el = $("conn");
  el.className = state;
  $("conn-text").textContent = text;
}

function agentCard(a, node) {
  // 只有本机的 Agent 能在这里启停 —— 别的机器上的进程不归这个面板管
  // 远端那台也能启停 —— 走它自己的 remote_admin 开关，没开就会给一句明确的拒绝。
  // 删 Agent 目前只对本机开放：那是改配置，另有一条路（配置抽屉选机器）。
  const where = `data-agent="${esc(a.name)}" data-node="${esc(node.node)}"`;
  const ops = canWrite
    ? `<span class="ops">
         <button class="ghost" type="button" ${where}
                 data-op="${a.running ? "stop" : "start"}">${a.running ? "停" : "启动"}</button>
         ${!a.running && node.local ? `<button class="ghost" type="button" ${where}
                 data-op="remove">删</button>` : ""}
       </span>`
    : "";
  return `
    <div class="card">
      <div class="row">
        <span class="dot ${a.running ? "on" : ""}"></span>
        <span class="name grow truncate">${esc(a.name)}</span>
        ${ops}
        <span class="pill">${esc(a.role)}</span>
      </div>
      <div class="row meta">
        <span class="grow truncate">${esc(a.provider)} · ${esc(a.watch_mode)}</span>
        ${a.queue ? `<span class="pill warn">待处理 ${esc(a.queue)}</span>` : ""}
        ${a.dead ? `<span class="pill bad">死信 ${esc(a.dead)}</span>` : ""}
      </div>
    </div>`;
}

function addAgentForm() {
  return `
    <form class="add-agent" id="add-agent">
      <div class="line">
        <input id="agent-name" placeholder="新 Agent 的名字" autocomplete="off" />
        <select id="agent-brain">
          <option value="echo">echo（只回显，用来跑通链路）</option>
          <option value="bridge">bridge（你的 Claude Code 会话）</option>
          <option value="command">command（claude -p 这类）</option>
          <option value="provider">provider（自研 loop 接模型）</option>
        </select>
      </div>
      <div class="line">
        <input id="agent-extra" placeholder="命令行或 provider 名，echo/bridge 留空" autocomplete="off" />
        <button type="submit">加上</button>
      </div>
    </form>`;
}

function renderTopo(nodes) {
  const total = nodes.reduce((n, x) => n + (x.agents || []).length, 0);
  const live = nodes.reduce((n, x) => n + (x.agents || []).filter(a => a.running).length, 0);
  $("topo-count").textContent = `${nodes.length} 个节点 · ${live}/${total} 在跑`;

  $("topo-body").innerHTML = nodes.map(node => `
    <div class="node-group ${node.reachable ? "" : "down"}">
      <div class="node-head">
        <span class="dot ${node.reachable ? "on" : ""}"></span>
        <span class="name grow truncate">${esc(node.node)}</span>
        <span class="tag">${node.local ? "本机" : node.reachable ? "已连上" : "连不上"}</span>
        ${node.pairable && canWrite
          ? `<button class="ghost" type="button" data-pair="${esc(node.node)}">配对</button>`
          : ""}
      </div>
      ${node.reachable
        ? (node.agents || []).map((a) => agentCard(a, node)).join("") ||
          `<div class="meta" style="padding:4px 10px">这个节点没有配置 Agent</div>`
        : `<div class="meta" style="padding:4px 10px">${esc(node.reason || "")}</div>`}
      ${node.local && canWrite ? addAgentForm() : ""}
    </div>`).join("") || `<div class="empty">还没有配置 Agent</div>`;
}

function renderRuns(nodes) {
  const runs = nodes.flatMap(n => (n.runs || []).map(r => ({ ...r, where: n.node })));
  const live = runs.filter(r => !r.finished);
  $("runs-count").textContent = `进行中 ${live.length} · 已完成 ${runs.length - live.length}`;
  if (!runs.length) {
    $("runs-body").innerHTML = `<div class="empty">还没有编排任务 —— 试试 <code>anthill run "…"</code></div>`;
    return;
  }
  $("runs-body").innerHTML = [...live, ...runs.filter(r => r.finished).slice(-3)].map(r => `
    <div class="run">
      <div class="row">
        <span class="where">${esc(r.where)}</span>
        <span class="goal grow truncate">${esc(r.goal)}</span>
        ${r.round ? `<span class="pill warn">返工 ${esc(r.round)}</span>` : ""}
        <span class="pill ${r.finished ? "ok" : ""}">${r.finished ? "已完成" : "进行中"}</span>
      </div>
      <div class="steps">
        ${(r.steps || []).map(s => `
          <div class="step ${esc(s.state)}">
            <span class="sid">${esc(s.id)}</span>
            <span class="who truncate">${esc(s.assignee)}</span>
            <span class="what grow truncate">${esc(s.detail)}</span>
          </div>`).join("")}
      </div>
    </div>`).join("");
}

function renderEvents(nodes) {
  const events = nodes
    .flatMap(n => (n.events || []).map(e => ({ ...e, where: n.node })))
    // 按完整时间戳排，不能按显示用的 HH:MM:SS —— 跨零点会把新事件排到最前面然后截掉
    .sort((a, b) => (a.sort || a.ts || "").localeCompare(b.sort || b.ts || ""))
    .slice(-80);
  $("events-count").textContent = `最近 ${events.length} 条`;
  const body = $("stream-body");
  const pinned = body.scrollHeight - body.scrollTop - body.clientHeight < 40;
  body.innerHTML = events.length
    ? events.map(e => `
      <div class="event ${esc(e.level)}">
        <span class="ts">${esc(e.ts)}</span>
        <span class="where truncate">${esc(e.where)}</span>
        <span class="who truncate">${esc(e.agent)}</span>
        <span class="what">${esc(e.event)}</span>
        <span class="detail truncate">${esc(e.detail)}</span>
      </div>`).join("")
    : `<div class="empty">还没有事件</div>`;
  if (pinned) body.scrollTop = body.scrollHeight;  // 贴底时才自动跟随，别打断正在往回翻的人
}

// 两路数据合成一张图：
//   WebSocket —— 每 2 秒推**本机**快照，kill -9 之后立刻变灰
//   api/cluster —— 每 5 秒拉一次全集群，远端本来也只有这个新鲜度
// 分开是有原因的：让 WS 每 2 秒去连一遍每台机器（SSH 还要重开连接），
// 整个面板的刷新节奏就被最慢那台拖住了。
const CLUSTER_REFRESH = 5000;
const state = { node: "", nodes: [] };
let socketLive = false;

function asNode(snapshot) {
  // 默认值放在展开之后：远端传来的 payload 不能把 local / reachable 覆盖掉
  return { ...snapshot, node: snapshot.node, local: true, reachable: true };
}

function draw() {
  $("node").textContent = state.node || "?";
  document.title = `AntHill · ${state.node || ""}`;
  renderTopo(state.nodes);
  renderRuns(state.nodes);
  renderEvents(state.nodes);
  if (canWrite) { syncConfigNodes(); syncAgentPicker(); }
}

function applyCluster(data) {
  state.node = data.node || state.node;
  state.nodes = data.nodes || [asNode(data)];  // 单机节点没有 nodes 字段
  draw();
}

function applyLocal(snapshot) {
  // WS 推来的只是本机 —— 只换本机那一格，别把别的机器抹掉
  state.node = snapshot.node || state.node;
  state.nodes = [asNode(snapshot), ...state.nodes.filter(n => !n.local && n.node !== snapshot.node)];
  draw();
}

let polling = false;

async function poll() {
  // 上一次还没回来就跳过：一台机器慢，不该让请求越堆越多
  if (polling) return;
  polling = true;
  try {
    // 总控视图只对本机开放（403）；面板开在 0.0.0.0 时退回只看本机
    const res = await fetch("api/cluster");
    const fallback = res.status === 403 ? await fetch("api/state") : null;
    const use = fallback || res;
    if (!use.ok) throw new Error(`HTTP ${use.status}`);
    applyCluster(await use.json());
    if (!socketLive) setConn("live", fallback ? "本机" : "轮询");
  } catch (err) {
    if (!socketLive) setConn("down", "连接不上");
  } finally {
    polling = false;
  }
}

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  let socket;
  try {
    socket = new WebSocket(`${proto}://${location.host}${location.pathname.replace(/\/$/, "")}/ws`);
  } catch (err) {
    return;  // 没有 WS 也能用，只是本机的粒度退化到 5 秒
  }
  socket.onopen = () => { socketLive = true; setConn("live", "实时"); };
  socket.onmessage = (msg) => applyLocal(JSON.parse(msg.data));
  socket.onclose = () => {
    socketLive = false;
    setConn("down", "已断开，重连中");
    setTimeout(connect, 2000);
  };
  socket.onerror = () => socket.close();
}

// ---- 对话：选一个 Agent 就是一个会话，接着同一个 thread 往下说 ----
const chat = { to: "", thread: "", messages: [], seen: "" };

function agentOptions() {
  const out = [];
  for (const node of state.nodes) {
    for (const agent of node.agents || []) {
      // 本机的 cli 是面板自己的身份，跟自己说话没有意义
      if (node.local && agent.name === "cli") continue;
      out.push({
        value: node.local ? agent.name : `${node.node}:${agent.name}`,
        label: node.local ? agent.name : `${node.node} · ${agent.name}`,
      });
    }
  }
  return out;
}

function syncAgentPicker() {
  const picker = $("chat-to");
  const options = agentOptions();
  const signature = options.map((o) => o.value).join(",");
  if (signature === chat.seen) return;   // 别在人正在选的时候把下拉框重建掉
  chat.seen = signature;
  picker.innerHTML = options
    .map((o) => `<option value="${esc(o.value)}">${esc(o.label)}</option>`)
    .join("");
  if (chat.to && options.some((o) => o.value === chat.to)) picker.value = chat.to;
  else chat.to = picker.value || "";
}

function renderChat() {
  const body = $("chat-body");
  const pinned = body.scrollHeight - body.scrollTop - body.clientHeight < 60;
  body.innerHTML = chat.messages.length
    ? chat.messages.map((m) => `
      <div class="msg ${m.mine ? "mine" : m.type === "receipt.accepted" ? "sys" : "them"}">
        <span class="who">${esc(m.mine ? "我" : m.frm)}</span>
        <span class="text">${esc(m.body)}</span>
      </div>`).join("")
    : `<div class="empty">还没有对话 —— 选一个 Agent，说点什么</div>`;
  if (pinned) body.scrollTop = body.scrollHeight;
}

async function loadChat() {
  if (!chat.thread) { chat.messages = []; renderChat(); return; }
  try {
    const res = await fetch(`api/chat/${encodeURIComponent(chat.thread)}`);
    if (!res.ok) return;
    chat.messages = (await res.json()).messages || [];
    renderChat();
  } catch (err) { /* 下一轮再说 */ }
}

async function pickThreadFor(target) {
  // 接着跟这个 Agent 最近的那次对话往下说，thread 记忆才连得上
  try {
    const res = await fetch("api/chats");
    if (!res.ok) return "";
    const found = ((await res.json()).threads || []).find((t) => String(t.with || "").endsWith(target));
    return found ? found.thread : "";
  } catch (err) { return ""; }
}

$("chat-to").addEventListener("change", async (event) => {
  chat.to = event.target.value;
  chat.thread = await pickThreadFor(chat.to);
  await loadChat();
});

$("chat-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const input = $("chat-input");
  const body = input.value.trim();
  if (!body || !chat.to) return;
  say("chat-hint", "");
  try {
    const sent = await api("panel/api/send", {
      method: "POST",
      body: JSON.stringify({ to: chat.to, body, kind: "chat", thread: chat.thread || undefined }),
    });
    chat.thread = sent.thread;
    input.value = "";
    await loadChat();
  } catch (err) {
    say("chat-hint", String(err.message || err), "bad");
  }
});

for (const tab of document.querySelectorAll(".tab")) {
  tab.addEventListener("click", () => {
    const pane = tab.dataset.pane;
    for (const other of document.querySelectorAll(".tab")) other.classList.toggle("on", other === tab);
    $("stream-body").hidden = pane !== "events";
    $("chat-body").hidden = pane !== "chat";
    $("chat-form").hidden = pane !== "chat" || !canWrite;
    if (pane === "chat") { syncAgentPicker(); loadChat(); }
  });
}

// ---- 工作区：还没配好时这是唯一能做的事；配好之后用来管这台机器上的几个 ----
const picker = { at: "", ready: true };

function renderWorkspaces(info) {
  ready.ready = info.ready;
  $("setup-count").textContent = info.ready
    ? `${info.workspaces.length} 个 · 当前 ${info.node}`
    : "还没配 —— 挑一个目录";
  $("ws-list").innerHTML = info.workspaces.length
    ? info.workspaces.map((w) => `
      <div class="ws ${w.current ? "now" : ""}">
        <span class="dot ${w.current ? "on" : ""}"></span>
        <span class="name">${esc(w.name)}</span>
        <span class="pill">${esc(w.node || "未命名")}</span>
        <span class="path grow truncate">${esc(w.path)}</span>
        ${w.current
          ? `<span class="meta">当前</span>`
          : `<button class="ghost" type="button" data-ws="${esc(w.path)}" data-ws-op="forget">移出清单</button>
             <button class="ghost" type="button" data-ws="${esc(w.path)}" data-ws-op="purge">删除</button>`}
      </div>`).join("")
    : `<div class="empty">这台机器上还没有工作区</div>`;
  // 没配好时直接把目录浏览器摊开，别让人还要找
  if (!info.ready && $("picker").hidden) openPicker(info.home);
}

const ready = { ready: true };

async function openPicker(path) {
  $("picker").hidden = false;
  await browseTo(path || picker.at);
}

async function browseTo(path) {
  try {
    const info = await api(`panel/api/setup/browse?path=${encodeURIComponent(path || "")}`);
    picker.at = info.path;
    $("crumb-path").textContent = info.path;
    $("crumb-up").dataset.path = info.parent;
    $("crumb-up").disabled = !info.parent;
    $("dir-list").innerHTML = info.entries.length
      ? info.entries.map((e) => `
        <div class="dir" data-dir="${esc(e.path)}">
          <span>${esc(e.name)}</span>
          ${e.is_workspace ? `<span class="tag">已是工作区</span>` : ""}
        </div>`).join("")
      : `<div class="empty">这里没有子目录</div>`;
    say("setup-hint", "");
  } catch (err) {
    say("setup-hint", String(err.message || err), "bad");
  }
}

$("setup-toggle").addEventListener("click", () => {
  const hidden = $("picker").hidden;
  $("picker").hidden = !hidden;
  if (hidden) openPicker(picker.at);
});

$("crumb-up").addEventListener("click", (event) => browseTo(event.target.dataset.path));

document.addEventListener("click", (event) => {
  const dir = event.target.closest?.("[data-dir]");
  if (dir) { browseTo(dir.dataset.dir); return; }
  const ws = event.target.closest?.("[data-ws]");
  if (ws) removeWorkspace(ws.dataset.ws, ws.dataset.wsOp === "purge");
});

async function removeWorkspace(path, purge) {
  const what = purge
    ? `连同 .anthill/ 一起删掉？\n\n${path}\n\n里面的密钥、邮箱、黑板都会没有。`
    : `把 ${path} 移出清单？（文件不动）`;
  if (!window.confirm(what)) return;
  try {
    await api(`panel/api/setup/workspace?path=${encodeURIComponent(path)}&purge=${purge}`,
              { method: "DELETE" });
    refreshSetup();
  } catch (err) {
    window.alert(String(err.message || err));
  }
}

$("ws-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const sub = $("ws-name").value.trim();
  const path = sub ? `${picker.at.replace(/\/$/, "")}/${sub}` : picker.at;
  try {
    await api("panel/api/setup/adopt", {
      method: "POST",
      body: JSON.stringify({ path, node_name: $("ws-node").value.trim() }),
    });
    $("ws-name").value = "";
    if (!ready.ready) { location.reload(); return; }   // 刚从「未配置」活过来，整页重来最干净
    refreshSetup();
    poll();
  } catch (err) {
    say("setup-hint", String(err.message || err), "bad");
  }
});

async function refreshSetup() {
  try {
    renderWorkspaces(await api("panel/api/setup"));
    $("setup").hidden = false;
  } catch (err) {
    $("setup").hidden = true;   // 没有写权限就整块不显示，和其他写操作一致
  }
}

// ---- 写操作：探测一次能力，不能写就整块不显示 ----
let canWrite = false;
async function api(path, options) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || `HTTP ${res.status}`);
  return body;
}

function say(id, text, kind) {
  const el = $(id);
  el.hidden = !text;
  el.textContent = text;
  el.className = `hint${kind ? " " + kind : ""}`;
}

async function enableActions() {
  try {
    // 能读到配置就说明写入口挂着；读不到（404/403）就保持只读形态
    const { text } = await api("panel/api/config");
    $("config-text").value = text;
  } catch (err) {
    return false;
  }
  canWrite = true;
  $("run-form").hidden = false;
  $("config").hidden = false;
  $("footer").textContent =
    "写权限已开（仅本机）—— 危险操作的确认仍然只在 CLI。改别台机器的配置需要那台开了 remote_admin。";
  return true;
}

// ---- 配置：改哪台机器 ----
function syncConfigNodes() {
  const picker = $("config-node");
  const names = state.nodes.filter((n) => n.reachable).map((n) => n.node);
  const signature = names.join(",");
  if (signature === picker.dataset.signature) return;
  picker.dataset.signature = signature;
  const keep = picker.value;
  picker.innerHTML = names
    .map((n) => `<option value="${esc(n)}">${esc(n)}${n === state.node ? "（本机）" : ""}</option>`)
    .join("");
  picker.value = names.includes(keep) ? keep : state.node;
}

async function loadConfig() {
  const node = $("config-node").value || state.node;
  say("config-hint", node === state.node ? "" : `正在看 ${node} 的配置`);
  try {
    const { text } = await api(`panel/api/config?node=${encodeURIComponent(node)}`);
    $("config-text").value = text;
  } catch (err) {
    $("config-text").value = "";
    say("config-hint", String(err.message || err), "bad");
  }
}

$("config-node").addEventListener("change", loadConfig);

// ---- 配对：见过但还不能通信的节点，在这里换密钥 ----
async function startPairing(target) {
  const pin = window.prompt(
    `和 ${target} 配对。\n\n` +
    "· 对方屏幕上有 PIN 的话，填在这里；\n" +
    "· 想让对方来连你，直接留空确定，本机会生成一个 PIN。",
    "",
  );
  if (pin === null) return;
  try {
    if (pin.trim()) {
      const done = await api("panel/api/pair/join", {
        method: "POST",
        body: JSON.stringify({ target, pin: pin.trim() }),
      });
      window.alert(`已和 ${done.node} 配对\n指纹 ${done.fingerprint}\n和对方屏幕上的核对一致`);
    } else {
      const open = await api("panel/api/pair/open", { method: "POST" });
      window.alert(
        `本机 PIN：${open.pin}\n\n${open.seconds} 秒内有效，只能用一次。\n` +
        "让对方在他的面板上点「配对」并输入这串数字。",
      );
    }
    poll();
  } catch (err) {
    window.alert(String(err.message || err));
  }
}

document.addEventListener("click", (event) => {
  const pair = event.target.closest?.("[data-pair]");
  if (pair) { startPairing(pair.dataset.pair); return; }
  const op = event.target.closest?.("[data-agent]");
  if (op) runAgentOp(op.dataset.agent, op.dataset.op, op.dataset.node, op);
});

// 拓扑是每次轮询重画的，表单不能在渲染时挂监听（会重复挂），改成事件委托
document.addEventListener("submit", async (event) => {
  if (event.target.id !== "add-agent") return;
  event.preventDefault();
  const name = $("agent-name").value.trim();
  const brain = $("agent-brain").value;
  const extra = $("agent-extra").value.trim();
  if (!name) return;
  const body = { name, brain };
  if (brain === "command") body.command = extra;
  if (brain === "provider") body.provider = extra;
  try {
    await api("panel/api/agents", { method: "POST", body: JSON.stringify(body) });
    poll();
  } catch (err) {
    window.alert(String(err.message || err));
  }
});

async function runAgentOp(name, op, node, button) {
  if (op === "remove" && !window.confirm(`把 ${name} 从 node.toml 里删掉？`)) return;
  button.disabled = true;
  const at = node && node !== state.node ? `?node=${encodeURIComponent(node)}` : "";
  try {
    if (op === "remove") await api(`panel/api/agents/${encodeURIComponent(name)}`, { method: "DELETE" });
    else await api(`panel/api/agents/${encodeURIComponent(name)}/${op}${at}`, { method: "POST" });
    // 启停要几百毫秒才在 runtime.json 上体现出来，等一拍再刷
    setTimeout(poll, 700);
  } catch (err) {
    window.alert(String(err.message || err));
  } finally {
    button.disabled = false;
  }
}

$("run-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const input = $("run-input");
  const task = input.value.trim();
  if (!task) return;
  say("run-hint", "发起中…");
  try {
    const body = await api("panel/api/run", {
      method: "POST",
      body: JSON.stringify({ task }),
    });
    input.value = "";
    say("run-hint", `已交给 ${body.to} · thread ${body.thread.slice(-6)}`, "ok");
    poll();
  } catch (err) {
    say("run-hint", String(err.message || err), "bad");
  }
});

$("config-reload").addEventListener("click", loadConfig);

$("config-save").addEventListener("click", async () => {
  const button = $("config-save");
  button.disabled = true;
  say("config-hint", "校验并保存中…");
  try {
    const node = $("config-node").value || state.node;
    await api("panel/api/config", {
      method: "PUT",
      body: JSON.stringify({ text: $("config-text").value, node }),
    });
    say("config-hint", `已保存到 ${node}（上一版存为 node.toml.bak）；重启 agentd 后生效`, "ok");
  } catch (err) {
    // 校验没过时磁盘一个字都没改，把原因原样告诉人
    say("config-hint", String(err.message || err), "bad");
  } finally {
    button.disabled = false;
  }
});

refreshSetup();
poll();
setInterval(poll, CLUSTER_REFRESH);
setInterval(() => { if (!$("chat-body").hidden) loadChat(); }, 2000);
connect();
enableActions();
</script>
</body>
</html>
