<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AntHill 面板</title>
<style>
/* 视觉方向：贴着终端用的技术仪表盘。等宽字体为主，状态一律用语义色，
   信息密度优先 —— 这是排查问题时开着的第二个窗口，不是营销页。 */
:root {
  color-scheme: dark light;
  --bg: #0e0f13;
  --surface: #16181f;
  --surface-2: #1c1f28;
  --line: #262a36;
  --text: #e6e8ef;
  --muted: #8b91a3;
  --dim: #5d6376;
  --accent: #f0a02c;      /* 蚁丘的琥珀色 */
  --ok: #4ec9a0;
  --warn: #e3b341;
  --bad: #f2726f;
  --idle: #6b7286;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --gap: 14px;
  --radius: 10px;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f0f2f6; --line: #dfe3ea;
    --text: #14161c; --muted: #5a6172; --dim: #868da0; --accent: #b96f06;
    --ok: #16855f; --warn: #9a7212; --bad: #c33c39; --idle: #7b8296;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--mono); font-size: 13px; line-height: 1.55;
}
a { color: var(--accent); }

/* ---- 顶栏：节点身份是最大的一块字，其余都压小 ---- */
header {
  display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  padding: 18px 22px 14px; border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
  position: sticky; top: 0; z-index: 5;
}
header h1 {
  margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em;
}
header h1 .mark { color: var(--accent); }
header .node { font-size: 13px; color: var(--muted); }
header .node b { color: var(--text); font-weight: 600; }
#conn { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; gap: 7px; align-items: center; }
#conn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--idle); }
#conn.live .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
#conn.down .dot { background: var(--bad); }

/* ---- bento：左栏拓扑，右侧上任务下消息流 ---- */
main {
  display: grid; gap: var(--gap); padding: var(--gap) 22px 26px;
  grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
  grid-template-areas: "topo runs" "topo stream" "config config";
  grid-template-rows: auto minmax(0, 1fr) auto;
  min-height: calc(100vh - 66px);
}
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; grid-template-areas: "topo" "runs" "stream" "config"; }
}
section {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  display: flex; flex-direction: column; min-height: 0; overflow: hidden;
}
#topo { grid-area: topo; } #runs { grid-area: runs; } #stream { grid-area: stream; }
section > h2 {
  margin: 0; padding: 11px 14px; font-size: 11px; font-weight: 600;
  letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted);
  border-bottom: 1px solid var(--line); background: var(--surface-2);
  display: flex; justify-content: space-between; align-items: center;
}
section > h2 .count { color: var(--dim); letter-spacing: 0; text-transform: none; }
.body { overflow: auto; padding: 8px; flex: 1; min-height: 0; }
.empty { color: var(--dim); padding: 18px 8px; text-align: center; }

/* ---- 卡片：hover 有明确反馈，不是死的表格 ---- */
.card {
  border: 1px solid transparent; border-radius: 7px; padding: 8px 10px;
  transition: background 140ms ease, border-color 140ms ease;
}
.card:hover { background: var(--surface-2); border-color: var(--line); }
.row { display: flex; align-items: baseline; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.name { font-weight: 600; }
.meta { color: var(--dim); font-size: 12px; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---- 状态点：颜色是唯一的状态语言，别处不再用装饰色 ---- */
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--idle); }
.dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
.pill {
  font-size: 11px; padding: 1px 7px; border-radius: 99px;
  border: 1px solid var(--line); color: var(--muted); background: var(--surface-2);
}
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }

/* ---- 任务：步骤用左侧色条串起来，一眼看出卡在哪一步 ---- */
.run { padding: 10px 12px; border-radius: 8px; background: var(--surface-2); margin-bottom: 8px; }
.run > .row { margin-bottom: 6px; }
.goal { font-weight: 600; }
.steps { display: flex; flex-direction: column; gap: 3px; }
.step { display: flex; gap: 9px; align-items: baseline; padding-left: 9px; border-left: 2px solid var(--line); }
.step.running { border-left-color: var(--warn); }
.step.done { border-left-color: var(--ok); }
.step.failed { border-left-color: var(--bad); }
.step.skipped { border-left-color: var(--dim); }
.step .sid { color: var(--muted); min-width: 34px; }
.step .who { color: var(--accent); min-width: 96px; }
.step .what { color: var(--muted); }

/* ---- 消息流：等宽对齐的时间线 ---- */
.event { display: flex; gap: 10px; padding: 2px 6px; border-radius: 5px; }
.event:hover { background: var(--surface-2); }
.event .ts { color: var(--dim); flex: none; }
.event .who { color: var(--accent); flex: none; min-width: 92px; }
.event .what { flex: none; min-width: 168px; }
.event .detail { color: var(--muted); }
.event.warn .what { color: var(--warn); }
.event.error .what { color: var(--bad); }
/* ---- 节点分组：总控视图下，每台机器一组 ---- */
.node-group { margin-bottom: 10px; }
.node-head {
  display: flex; align-items: baseline; gap: 8px; padding: 6px 10px 4px;
  border-bottom: 1px dashed var(--line); margin-bottom: 4px;
}
.node-head .name { font-weight: 600; letter-spacing: 0.02em; }
.node-head .tag { font-size: 11px; color: var(--dim); }
.node-group.down { opacity: 0.72; }
.node-group.down .node-head { border-bottom-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.where { color: var(--dim); flex: none; min-width: 84px; }

/* ---- 操作条：写权限开着才出现 ---- */
.actions { display: flex; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.actions input, .actions select, textarea {
  background: var(--bg); color: var(--text); border: 1px solid var(--line);
  border-radius: 7px; padding: 7px 10px; font-family: var(--mono); font-size: 13px;
  transition: border-color 140ms ease, box-shadow 140ms ease;
}
.actions input { flex: 1; min-width: 0; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
}
button {
  background: var(--accent); color: #1a1206; border: 1px solid transparent;
  border-radius: 7px; padding: 7px 14px; font-family: var(--mono); font-size: 13px;
  font-weight: 600; cursor: pointer; transition: filter 140ms ease, transform 80ms ease;
}
button:hover { filter: brightness(1.08); }
button:active { transform: translateY(1px); }
button.ghost { background: transparent; color: var(--muted); border-color: var(--line); }
button.ghost:hover { color: var(--text); border-color: var(--muted); }
button[disabled] { opacity: 0.5; cursor: not-allowed; }
.hint { padding: 0 12px 10px; font-size: 12px; color: var(--dim); }
.hint.bad { color: var(--bad); }
.hint.ok { color: var(--ok); }

/* ---- 配置抽屉 ---- */
#config { grid-area: config; }
#config textarea { width: 100%; min-height: 220px; resize: vertical; line-height: 1.5; }
.drawer-head { display: flex; align-items: center; gap: 10px; }
footer { padding: 0 22px 20px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1><span class="mark">▲</span> AntHill</h1>
  <span class="node">节点 <b id="node">…</b></span>
  <span id="conn"><span class="dot"></span><span id="conn-text">连接中</span></span>
</header>

<main>
  <section id="topo">
    <h2>拓扑 <span class="count" id="topo-count"></span></h2>
    <div class="body" id="topo-body"></div>
  </section>

  <section id="runs">
    <h2>任务看板 <span class="count" id="runs-count"></span></h2>
    <form class="actions" id="run-form" hidden>
      <input id="run-input" placeholder="交给 coordinator 一件事，回车发起…" autocomplete="off" />
      <button type="submit">发起</button>
    </form>
    <div class="hint" id="run-hint" hidden></div>
    <div class="body" id="runs-body"></div>
  </section>

  <section id="stream">
    <h2>消息流 <span class="count" id="events-count"></span></h2>
    <div class="body" id="stream-body"></div>
  </section>
</main>

  <section id="config" hidden>
    <h2>
      <span class="drawer-head">node.toml <span class="count">改坏了所有 agentd 都起不来，保存前会先校验</span></span>
      <span class="drawer-head">
        <button class="ghost" id="config-reload" type="button">重新读取</button>
        <button id="config-save" type="button">保存</button>
      </span>
    </h2>
    <div class="body">
      <textarea id="config-text" spellcheck="false"></textarea>
      <div class="hint" id="config-hint"></div>
    </div>
  </section>
<footer id="footer">只读面板 —— 确认与操作留在 CLI。数据来自 <code>.anthill/</code> 下的文件。</footer>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function setConn(state, text) {
  const el = $("conn");
  el.className = state;
  $("conn-text").textContent = text;
}

function agentCard(a) {
  return `
    <div class="card">
      <div class="row">
        <span class="dot ${a.running ? "on" : ""}"></span>
        <span class="name grow truncate">${esc(a.name)}</span>
        <span class="pill">${esc(a.role)}</span>
      </div>
      <div class="row meta">
        <span class="grow truncate">${esc(a.provider)} · ${esc(a.watch_mode)}</span>
        ${a.queue ? `<span class="pill warn">待处理 ${esc(a.queue)}</span>` : ""}
        ${a.dead ? `<span class="pill bad">死信 ${esc(a.dead)}</span>` : ""}
      </div>
    </div>`;
}

function renderTopo(nodes) {
  const total = nodes.reduce((n, x) => n + (x.agents || []).length, 0);
  const live = nodes.reduce((n, x) => n + (x.agents || []).filter(a => a.running).length, 0);
  $("topo-count").textContent = `${nodes.length} 个节点 · ${live}/${total} 在跑`;

  $("topo-body").innerHTML = nodes.map(node => `
    <div class="node-group ${node.reachable ? "" : "down"}">
      <div class="node-head">
        <span class="dot ${node.reachable ? "on" : ""}"></span>
        <span class="name grow truncate">${esc(node.node)}</span>
        <span class="tag">${node.local ? "本机" : node.reachable ? "已连上" : "连不上"}</span>
      </div>
      ${node.reachable
        ? (node.agents || []).map(agentCard).join("") ||
          `<div class="meta" style="padding:4px 10px">这个节点没有配置 Agent</div>`
        : `<div class="meta" style="padding:4px 10px">${esc(node.reason || "")}</div>`}
    </div>`).join("") || `<div class="empty">还没有配置 Agent</div>`;
}

function renderRuns(nodes) {
  const runs = nodes.flatMap(n => (n.runs || []).map(r => ({ ...r, where: n.node })));
  const live = runs.filter(r => !r.finished);
  $("runs-count").textContent = `进行中 ${live.length} · 已完成 ${runs.length - live.length}`;
  if (!runs.length) {
    $("runs-body").innerHTML = `<div class="empty">还没有编排任务 —— 试试 <code>anthill run "…"</code></div>`;
    return;
  }
  $("runs-body").innerHTML = [...live, ...runs.filter(r => r.finished).slice(-3)].map(r => `
    <div class="run">
      <div class="row">
        <span class="where">${esc(r.where)}</span>
        <span class="goal grow truncate">${esc(r.goal)}</span>
        ${r.round ? `<span class="pill warn">返工 ${esc(r.round)}</span>` : ""}
        <span class="pill ${r.finished ? "ok" : ""}">${r.finished ? "已完成" : "进行中"}</span>
      </div>
      <div class="steps">
        ${(r.steps || []).map(s => `
          <div class="step ${esc(s.state)}">
            <span class="sid">${esc(s.id)}</span>
            <span class="who truncate">${esc(s.assignee)}</span>
            <span class="what grow truncate">${esc(s.detail)}</span>
          </div>`).join("")}
      </div>
    </div>`).join("");
}

function renderEvents(nodes) {
  const events = nodes
    .flatMap(n => (n.events || []).map(e => ({ ...e, where: n.node })))
    // 按完整时间戳排，不能按显示用的 HH:MM:SS —— 跨零点会把新事件排到最前面然后截掉
    .sort((a, b) => (a.sort || a.ts || "").localeCompare(b.sort || b.ts || ""))
    .slice(-80);
  $("events-count").textContent = `最近 ${events.length} 条`;
  const body = $("stream-body");
  const pinned = body.scrollHeight - body.scrollTop - body.clientHeight < 40;
  body.innerHTML = events.length
    ? events.map(e => `
      <div class="event ${esc(e.level)}">
        <span class="ts">${esc(e.ts)}</span>
        <span class="where truncate">${esc(e.where)}</span>
        <span class="who truncate">${esc(e.agent)}</span>
        <span class="what">${esc(e.event)}</span>
        <span class="detail truncate">${esc(e.detail)}</span>
      </div>`).join("")
    : `<div class="empty">还没有事件</div>`;
  if (pinned) body.scrollTop = body.scrollHeight;  // 贴底时才自动跟随，别打断正在往回翻的人
}

// 两路数据合成一张图：
//   WebSocket —— 每 2 秒推**本机**快照，kill -9 之后立刻变灰
//   api/cluster —— 每 5 秒拉一次全集群，远端本来也只有这个新鲜度
// 分开是有原因的：让 WS 每 2 秒去连一遍每台机器（SSH 还要重开连接），
// 整个面板的刷新节奏就被最慢那台拖住了。
const CLUSTER_REFRESH = 5000;
const state = { node: "", nodes: [] };
let socketLive = false;

function asNode(snapshot) {
  // 默认值放在展开之后：远端传来的 payload 不能把 local / reachable 覆盖掉
  return { ...snapshot, node: snapshot.node, local: true, reachable: true };
}

function draw() {
  $("node").textContent = state.node || "?";
  document.title = `AntHill · ${state.node || ""}`;
  renderTopo(state.nodes);
  renderRuns(state.nodes);
  renderEvents(state.nodes);
}

function applyCluster(data) {
  state.node = data.node || state.node;
  state.nodes = data.nodes || [asNode(data)];  // 单机节点没有 nodes 字段
  draw();
}

function applyLocal(snapshot) {
  // WS 推来的只是本机 —— 只换本机那一格，别把别的机器抹掉
  state.node = snapshot.node || state.node;
  state.nodes = [asNode(snapshot), ...state.nodes.filter(n => !n.local && n.node !== snapshot.node)];
  draw();
}

let polling = false;

async function poll() {
  // 上一次还没回来就跳过：一台机器慢，不该让请求越堆越多
  if (polling) return;
  polling = true;
  try {
    // 总控视图只对本机开放（403）；面板开在 0.0.0.0 时退回只看本机
    const res = await fetch("api/cluster");
    const fallback = res.status === 403 ? await fetch("api/state") : null;
    const use = fallback || res;
    if (!use.ok) throw new Error(`HTTP ${use.status}`);
    applyCluster(await use.json());
    if (!socketLive) setConn("live", fallback ? "本机" : "轮询");
  } catch (err) {
    if (!socketLive) setConn("down", "连接不上");
  } finally {
    polling = false;
  }
}

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  let socket;
  try {
    socket = new WebSocket(`${proto}://${location.host}${location.pathname.replace(/\/$/, "")}/ws`);
  } catch (err) {
    return;  // 没有 WS 也能用，只是本机的粒度退化到 5 秒
  }
  socket.onopen = () => { socketLive = true; setConn("live", "实时"); };
  socket.onmessage = (msg) => applyLocal(JSON.parse(msg.data));
  socket.onclose = () => {
    socketLive = false;
    setConn("down", "已断开，重连中");
    setTimeout(connect, 2000);
  };
  socket.onerror = () => socket.close();
}

// ---- 写操作：探测一次能力，不能写就整块不显示 ----
async function api(path, options) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || `HTTP ${res.status}`);
  return body;
}

function say(id, text, kind) {
  const el = $(id);
  el.hidden = !text;
  el.textContent = text;
  el.className = `hint${kind ? " " + kind : ""}`;
}

async function enableActions() {
  try {
    // 能读到配置就说明写入口挂着；读不到（404/403）就保持只读形态
    const { text } = await api("panel/api/config");
    $("config-text").value = text;
  } catch (err) {
    return false;
  }
  $("run-form").hidden = false;
  $("config").hidden = false;
  $("footer").textContent = "写权限已开（仅本机）—— 危险操作的确认仍然只在 CLI。";
  return true;
}

$("run-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const input = $("run-input");
  const task = input.value.trim();
  if (!task) return;
  say("run-hint", "发起中…");
  try {
    const body = await api("panel/api/run", {
      method: "POST",
      body: JSON.stringify({ task }),
    });
    input.value = "";
    say("run-hint", `已交给 ${body.to} · thread ${body.thread.slice(-6)}`, "ok");
    poll();
  } catch (err) {
    say("run-hint", String(err.message || err), "bad");
  }
});

$("config-reload").addEventListener("click", async () => {
  try {
    $("config-text").value = (await api("panel/api/config")).text;
    say("config-hint", "已重新读取", "ok");
  } catch (err) {
    say("config-hint", String(err.message || err), "bad");
  }
});

$("config-save").addEventListener("click", async () => {
  const button = $("config-save");
  button.disabled = true;
  say("config-hint", "校验并保存中…");
  try {
    await api("panel/api/config", {
      method: "PUT",
      body: JSON.stringify({ text: $("config-text").value }),
    });
    say("config-hint", "已保存（上一版存为 node.toml.bak）；重启 agentd 后生效", "ok");
  } catch (err) {
    // 校验没过时磁盘一个字都没改，把原因原样告诉人
    say("config-hint", String(err.message || err), "bad");
  } finally {
    button.disabled = false;
  }
});

poll();
setInterval(poll, CLUSTER_REFRESH);
connect();
enableActions();
</script>
</body>
</html>
